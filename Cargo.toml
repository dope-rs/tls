[package]
name = "dope-tls"
version = "0.20.1"
edition = "2024"
rust-version = "1.98"
description = "TCP TLS streams for dope runtime, rustls-backed"
license = "MIT"
repository = "https://github.com/dope-rs/tls"
readme = "README.md"

[lib]
test = false

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
dope = "0.20.0"
o3 = "=0.20.0"
webpki-roots = "1.0.10"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
dope-fiber = "0.20.0"
dope-test = "0.20.0"
pin-project = "1"

[profile.release]
panic = "abort"
